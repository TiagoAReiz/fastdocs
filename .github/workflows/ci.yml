name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: fastdocs
          POSTGRES_PASSWORD: fastdocs
          # conftest.py derives the test DB name ("fastdocs_test") from DATABASE_URL
          POSTGRES_DB: fastdocs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fastdocs"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql+asyncpg://fastdocs:fastdocs@localhost:5432/fastdocs

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q
